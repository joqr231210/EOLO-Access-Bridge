services:
  eolo-access-bridge:
    build: .
    image: eolo-access-bridge:latest
    container_name: eolo-access-bridge
    depends_on:
      anpr-api:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8080}
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      ANPR_API_BASE_URL: http://anpr-api:8090
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port = process.env.PORT || 8080; fetch(`http://127.0.0.1:$${port}/api/health`).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  anpr-api:
    build:
      context: ./AnprEolo
    image: eolo-anpr-api:latest
    container_name: eolo-anpr-api
    env_file:
      - path: .env
        required: false
    environment:
      ANPR_API_PORT: 8090
      PORT: 8090
      ANPR_CONTROL_BASE_URL: http://127.0.0.1:8090
      ANPR_DB_FILE: /app/data/plates.db
      ANPR_CONFIG_FILE: /app/data/config.json
      ANPR_DETECTIONS_FILE: /app/data/anpr-detections.json
      ANPR_STATUS_FILE: /app/data/anpr-status.json
      ANPR_SNAPSHOT_DIR: /app/data/anpr-snapshots
      ANPR_STREAM_DIR: /app/stream
    expose:
      - "8090"
      - "8083"
    ports:
      - "${ANPR_STREAM_HOST_PORT:-8083}:8083"
    volumes:
      - ./AnprEolo/plates.db:/app/data/plates.db
      - ./AnprEolo/config.json:/app/data/config.json
      - ./AnprEolo/static/captures:/app/static/captures
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=5).read()"
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
