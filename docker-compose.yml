services:
  eolo-access-bridge:
    build: .
    image: eolo-access-bridge:latest
    container_name: eolo-access-bridge
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8080}
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port = process.env.PORT || 8080; fetch(`http://127.0.0.1:$${port}/api/health`).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
